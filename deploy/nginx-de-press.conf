# de-press nginx site — one origin: browser SPA at /, mini-app at /tg/,
# /admin static at /static/, media at /media/, API+WS proxied to daphne.
# Install: cp to /etc/nginx/sites-available/de-press, symlink, nginx -t, reload.
# Replace app.depress.co with your domain.

upstream depress_api {
    server 127.0.0.1:8000;
}

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

# Privacy: access logs without client IPs or user agents — the platform does
# not keep identity data (see PRIVACY.md at the repo root).
log_format privacy '$time_local "$request" $status $body_bytes_sent';

server {
    listen 80;
    server_name app.depress.co;
    location /.well-known/acme-challenge/ { root /var/www/html; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name app.depress.co;

    ssl_certificate     /etc/letsencrypt/live/app.depress.co/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.depress.co/privkey.pem;

    access_log /var/log/nginx/de-press.access.log privacy;

    # voice uploads (webm)
    client_max_body_size 15m;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    add_header X-Content-Type-Options nosniff always;

    # browser SPA
    root /opt/de-press/apps/browser/dist;
    index index.html;

    # Telegram Mini App (built with base=/tg/)
    location /tg/ {
        alias /opt/de-press/apps/mini-app/dist/;
        try_files $uri $uri/ /tg/index.html;
        add_header Content-Security-Policy "frame-ancestors 'self' https://web.telegram.org https://telegram.org https://*.telegram.org;" always;
    }

    # Staff admin console (built with base=/console/); noindex, staff-session only
    location /console/ {
        alias /opt/de-press/apps/admin/dist/;
        try_files $uri $uri/ /console/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # hashed bundles
    location /assets/ { expires 30d; access_log off; }

    # django admin static (collectstatic) and media (voice notes)
    location /static/ { alias /opt/de-press/backend/staticfiles/; expires 7d; access_log off; }
    location /media/  { alias /opt/de-press/backend/media/;      expires 7d; access_log off; }

    location /ws/ {
        proxy_pass http://depress_api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 300s;
    }

    location ~ ^/(api|admin|docs|openapi\.json)(/|$) {
        proxy_pass http://depress_api;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location / { try_files $uri $uri/ /index.html; }
}
