# nginx config inside the de-press docker-compose stack.
# Serves host-built frontend dist/ (mounted read-only) and proxies the API/WS
# to the `backend` service. Dev/self-host profile: plain HTTP on the container
# port 80 (mapped to host ${HTTP_PORT:-8080}); TLS is a reverse-proxy concern.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ""      close;
}

server {
    listen 80;
    server_name _;

    client_max_body_size 15m;

    # Browser SPA — built with base=/
    root /usr/share/nginx/html/browser;
    index index.html;

    # Telegram Mini App — built with base=/tg/
    location /tg/ {
        alias /usr/share/nginx/html/mini-app/;
        try_files $uri $uri/ /tg/index.html;
    }

    # Staff admin console — built with base=/console/
    location /console/ {
        alias /usr/share/nginx/html/admin/;
        try_files $uri $uri/ /console/index.html;
        add_header X-Robots-Tag "noindex, nofollow" always;
    }

    # Django media (voice notes, circles) — shared volume with the backend
    location /media/ { alias /usr/share/nginx/html/media/; expires 7d; }

    # API + WebSockets -> daphne in the backend container
    location /ws/ {
        proxy_pass http://backend:8005;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_read_timeout 300s;
    }

    location ~ ^/(api|admin|docs|openapi\.json|static)(/|$) {
        proxy_pass http://backend:8005;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA fallback (browser)
    location / {
        try_files $uri $uri/ /index.html;
    }
}
